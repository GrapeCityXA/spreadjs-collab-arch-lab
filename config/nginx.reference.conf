# =============================================================================
#  spreadjs-collab-arch-lab · nginx production REFERENCE config
# =============================================================================
#  This file is NOT used by the lab. `npm run up` starts the bundled Node load
#  balancer (src/lb/load-balancer.mjs) so the lab works on Windows/macOS/Linux
#  with zero extra installs. This config is what you copy when you deploy.
#
#  It is derived from a multi-server SpreadJS collaboration deployment that was
#  actually run (nginx 1.29, 3 nodes, WebSocket pass-through). Trimmed to the
#  minimum that matters and annotated with the reasons.
#
#  READ THIS FIRST — Windows:
#    nginx for Windows uses the select() event model with a single worker and a
#    1024 file-descriptor ceiling. ~500 WebSocket connections exhaust it, which
#    looks exactly like "half of the users cannot connect". Do not run this on
#    Windows in production. Use Linux nginx, HAProxy, an L4 balancer, or a
#    managed cloud LB.
#
#  WHICH UPSTREAM DO I USE?
#    shared  mode  -> `least_conn` (any node may serve any room). No affinity.
#    sharded mode  -> `hash $arg_roomId consistent;` — the SAME room must reach
#                     the SAME node. If your clients do not put roomId in the
#                     handshake query string, nginx cannot see it and cannot
#                     provide affinity; use the shared mode instead.
#    Keep exactly ONE upstream active and reference it from the location block.
# =============================================================================

worker_processes      auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/collab-error.log warn;
pid        /run/nginx.pid;

events {
    # One connection per collaboration user, plus keep-alive traffic.
    worker_connections  10240;
    multi_accept        on;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Shorter for normal traffic; the collaboration location overrides it.
    keepalive_timeout  65;

    # The upstream fields are the proof of which node served a request and of
    # any failover. Keep them: "the room is split across nodes" is diagnosed
    # from upstream_addr, not from the app logs.
    log_format  collaboration  '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               'upstream_addr=$upstream_addr '
                               'upstream_status=$upstream_status '
                               'upstream_connect_time=$upstream_connect_time '
                               'upstream_response_time=$upstream_response_time '
                               'request_time=$request_time';

    access_log  /var/log/nginx/collab-access.log collaboration;

    # WebSocket upgrade handshake.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # -------------------------------------------------------------------------
    #  shared mode: no affinity required, least connections is the right policy
    #  for long-lived WebSocket sessions. Passive health checks only:
    #  max_fails/fail_timeout take a dead node out of rotation temporarily.
    # -------------------------------------------------------------------------
    upstream collab_shared {
        least_conn;

        server 10.0.0.11:8081 max_fails=2 fail_timeout=5s;
        server 10.0.0.12:8081 max_fails=2 fail_timeout=5s;
        server 10.0.0.13:8081 max_fails=2 fail_timeout=5s;
    }

    # -------------------------------------------------------------------------
    #  sharded mode: room-key affinity.
    #
    #  `consistent` is what makes adding/removing a node reshuffle ~1/N of the
    #  rooms instead of all of them. Plain `hash` reshuffles everything.
    #
    #  $arg_roomId reads the `roomId` query parameter of the socket.io
    #  handshake request (the lab's own balancer also accepts `room` / `roomid`).
    #  If YOUR clients use a different parameter name, change it to match, e.g.
    #  `hash $arg_room consistent;` — otherwise every request hashes to "" and
    #  affinity is effectively random. If the client sends the room id in the
    #  first frame instead of the URL, this cannot work — pick the shared mode.
    #
    #  Trade-off to be aware of: nginx `hash` remaps rooms when the upstream
    #  list changes, so a room may be pinned to a different node after a
    #  scale-out. Users recover by reconnecting; do not scale out during peak.
    # -------------------------------------------------------------------------
    # upstream collab_sharded {
    #     hash $arg_roomId consistent;
    #
    #     server 10.0.0.11:8081 max_fails=2 fail_timeout=5s;
    #     server 10.0.0.12:8081 max_fails=2 fail_timeout=5s;
    #     server 10.0.0.13:8081 max_fails=2 fail_timeout=5s;
    # }

    server {
        listen       3000;
        server_name  collab.example.com;

        # ---------------------------------------------------------------------
        #  TLS: terminate here, keep the backends on plaintext inside the VPC.
        #  Uncomment, point the certs somewhere real, and change the client to
        #  wss://. `path` stays a client OPTION — never put it in the URL or
        #  socket.io treats it as a namespace and fails with Invalid namespace.
        # ---------------------------------------------------------------------
        # listen               443 ssl;
        # http2                on;
        # ssl_certificate      /etc/nginx/tls/fullchain.pem;
        # ssl_certificate_key  /etc/nginx/tls/privkey.pem;
        # ssl_protocols        TLSv1.2 TLSv1.3;

        # Proxied path must match the client's socket.io `path` option and every
        # node's SJS_PATH. The lab default is /collaboration/.
        location /collaboration/ {
            proxy_pass  http://collab_shared;

            # --- WebSocket tunnelling (all three are required) ---------------
            proxy_http_version 1.1;
            proxy_set_header   Upgrade        $http_upgrade;
            proxy_set_header   Connection     "upgrade";

            # --- Forwarding headers ------------------------------------------
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;

            # --- Long-lived sessions -----------------------------------------
            # nginx's 60s default silently kills idle collaboration sessions.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Every frame must reach the peer immediately; no buffering, and
            # keep the handshake byte-exact by disabling compression here.
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_set_header         Accept-Encoding "";
        }

        # Some clients hit the path without the trailing slash.
        location = /collaboration {
            proxy_pass  http://collab_shared;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade        $http_upgrade;
            proxy_set_header   Connection     "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_set_header         Accept-Encoding "";
        }

        # About the load balancer itself, not about a node.
        location = /healthz {
            access_log  off;
            default_type text/plain;
            return 200 "nginx load balancer ok\n";
        }

        # Nothing else is proxied. Removing this would turn typos into
        # confusing 502s from an unrelated upstream.
        location / {
            default_type text/plain;
            return 404 "nginx load balancer: only /collaboration is proxied\n";
        }
    }
}
