<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>协同客户端 · SpreadJS 协同架构实验室</title>
<!--
  Zero-license collaboration client.

  Everything here is served by the lab's web server as plain files:
    /vendor/socket.io.js       -> node_modules/socket.io/client-dist/socket.io.min.js
    /vendor/spread-sheets.js   -> @grapecity-software/spread-sheets UMD bundle
    /vendor/spread-sheets.css  -> SpreadJS stylesheet

  No bundler, no framework, no license key required on localhost. The page talks the
  lab mirror protocol (DEV-CONTRACT §4) directly over socket.io: `lab:join` in,
  `lab:snapshot`/`lab:op`/`lab:op-ack`/`lab:presence`/`sjs-node-info` back.
-->
<link rel="stylesheet" href="/vendor/spread-sheets.css">
<style>
  :root {
    --bg: #eef1f6;
    --card: #ffffff;
    --ink: #111827;
    --muted: #6b7280;
    --muted-2: #9ca3af;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --ok: #15803d;
    --ok-soft: #ecfdf3;
    --warn: #b45309;
    --warn-soft: #fffbeb;
    --err: #b91c1c;
    --err-soft: #fef2f2;
    --node-a: #7c3aed;
    --node-b: #0891b2;
    --node-c: #db2777;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(17, 24, 39, .06), 0 8px 24px -18px rgba(17, 24, 39, .35);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------------------------------------------------------------- header */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; font-size: 16px; font-weight: 700;
  }
  .brand-name { font-size: 14px; font-weight: 650; letter-spacing: .01em; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
    background: #f9fafb; color: var(--muted); font-size: 12px; white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.ok { color: var(--ok); background: var(--ok-soft); border-color: #bbf7d0; }
  .badge.warn { color: var(--warn); background: var(--warn-soft); border-color: #fde68a; }
  .badge.err { color: var(--err); background: var(--err-soft); border-color: #fecaca; }
  .badge.gray { color: var(--muted); background: #f3f4f6; border-color: var(--line); }

  /* ------------------------------------------------------------------ main */
  .layout {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 0;
  }
  .sheet-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 12px 0 12px 12px; }
  .sheet-toolbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; background: var(--card);
    border: 1px solid var(--line); border-bottom: 0;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .sheet-hint { color: var(--muted); font-size: 12px; min-width: 0; }
  .sheet-hint b { color: var(--ink); font-weight: 600; }
  .sheet-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn {
    font: inherit; font-size: 12px; cursor: pointer;
    padding: 5px 11px; border-radius: 7px;
    border: 1px solid var(--line); background: #f9fafb; color: var(--ink);
  }
  .btn:hover { background: #f3f4f6; }
  .btn:active { transform: translateY(1px); }
  #rtt { color: var(--muted); font-variant-numeric: tabular-nums; }
  #ss {
    flex: 1 1 auto; min-height: 0;
    background: #fff;
    border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }

  /* ---------------------------------------------------------------- sidebar */
  .side { min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 14px;
  }
  .card-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .card-title .count {
    margin-left: auto; text-transform: none; letter-spacing: 0;
    font-size: 11px; color: var(--muted); background: #f3f4f6;
    border-radius: 999px; padding: 1px 8px;
  }
  .card-title .muted { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted-2); }

  /* node card */
  .node-card { border-color: #dbeafe; background: linear-gradient(180deg, #f8fbff, #fff 55%); }
  .node-big { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .node-big .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--muted-2); box-shadow: 0 0 0 4px rgba(156, 163, 175, .18); }
  .node-big .dot.live { background: var(--ok); box-shadow: 0 0 0 4px rgba(21, 128, 61, .16); }
  .node-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; margin-top: 12px; }
  .node-meta > div { display: flex; flex-direction: column; gap: 1px; }
  .node-meta span { font-size: 11px; color: var(--muted-2); }
  .node-meta b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .node-note {
    margin-top: 12px; padding: 8px 10px; border-radius: 8px;
    background: var(--accent-soft); color: #1e40af; font-size: 11.5px; line-height: 1.5;
  }

  /* version */
  .version-row { display: flex; align-items: baseline; gap: 8px; }
  .version-num { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .version-label { font-size: 11px; color: var(--muted-2); }
  .kv { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 7px; }
  .kv span { color: var(--muted-2); min-width: 60px; }
  .kv b { font-weight: 600; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; word-break: break-all; }

  /* members */
  .members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .members li {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; background: #f9fafb; font-size: 12px;
  }
  .members li.empty { color: var(--muted-2); justify-content: center; background: transparent; }
  .who { display: flex; flex-direction: column; min-width: 0; }
  .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .sub { font-size: 10.5px; color: var(--muted-2); }
  .member-node {
    margin-left: auto; font-family: ui-monospace, Consolas, monospace;
    font-size: 10.5px; color: var(--muted); background: #fff;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; white-space: nowrap;
  }
  .member-node.cross { color: var(--warn); border-color: #fde68a; background: var(--warn-soft); }
  .me-tag { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 6px; }
  .dot-sm { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

  /* log */
  .log-card { flex: 1 1 auto; min-height: 130px; display: flex; flex-direction: column; }
  .log { overflow-y: auto; max-height: 240px; display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; }
  .log .line { display: flex; gap: 7px; padding: 3px 4px; border-radius: 5px; }
  .log .line + .line { border-top: 1px solid #f3f4f6; }
  .log .time { color: var(--muted-2); font-family: ui-monospace, Consolas, monospace; flex: 0 0 auto; font-size: 10.5px; padding-top: 1px; }
  .log .text { min-width: 0; word-break: break-word; }
  .log .line.ok .text { color: var(--ok); }
  .log .line.warn .text { color: var(--warn); }
  .log .line.error .text { color: var(--err); }
  .log .line.op .text { color: var(--accent); }
  .log .line.recv .text { color: #0f766e; }
  .log .line.dedupe .text { color: var(--muted-2); }

  /* boot / fatal overlay */
  .boot {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(238, 241, 246, .82); backdrop-filter: blur(2px);
    transition: opacity .25s ease;
  }
  .boot.hidden { opacity: 0; pointer-events: none; }
  .boot-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 24px 60px -30px rgba(17, 24, 39, .5); padding: 18px 22px;
    min-width: 320px; max-width: 520px; text-align: center;
  }
  .boot-box .spinner {
    width: 22px; height: 22px; margin: 0 auto 10px; border-radius: 50%;
    border: 2.5px solid #dbeafe; border-top-color: var(--accent); animation: spin .8s linear infinite;
  }
  .boot-box.error .spinner { display: none; }
  .boot-box h3 { margin: 0 0 4px; font-size: 14px; }
  .boot-box p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .boot-box code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 980px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">▦</div>
    <div>
      <div class="brand-name">SpreadJS 协同架构实验室</div>
      <div class="brand-sub">零授权 mirror 客户端 · 实时协同演示</div>
    </div>
  </div>
  <div class="chips">
    <span class="chip">房间 <b id="roomChip">—</b></span>
    <span class="chip">我 <b id="labelChip">—</b></span>
    <span id="connBadge" class="badge warn">连接中…</span>
  </div>
</header>

<main class="layout">
  <section class="sheet-pane">
    <div class="sheet-toolbar">
      <div class="sheet-hint">
        在任意单元格里输入内容 — 同房间的其它浏览器窗口会<b>实时出现同样的内容</b>。
      </div>
      <div class="sheet-actions">
        <button id="resyncBtn" class="btn" type="button">重新同步</button>
        <button id="pingBtn" class="btn" type="button">测延迟 <span id="rtt">—</span></button>
      </div>
    </div>
    <div id="ss" aria-label="SpreadJS 协作工作簿"></div>
  </section>

  <aside class="side">
    <section class="card node-card">
      <div class="card-title">服务我的节点</div>
      <div class="node-big"><span id="nodeDot" class="dot"></span><span id="nodeId">—</span></div>
      <div class="node-meta">
        <div><span>端口</span><b id="nodePort">—</b></div>
        <div><span>跨节点适配器</span><b id="nodeAdapter">—</b></div>
        <div><span>文档存储</span><b id="nodeStore">—</b></div>
        <div><span>实现</span><b id="nodeImpl">—</b></div>
      </div>
      <div class="node-note" id="nodeNote">
        同一个房间的成员如果落在不同节点，只有启用 Redis 适配器时编辑才能跨节点送达。
      </div>
    </section>

    <section class="card">
      <div class="card-title">文档</div>
      <div class="version-row"><div class="version-num" id="versionNum">0</div><div class="version-label">当前文档版本</div></div>
      <div class="kv"><span>房间</span><b id="docRoom">—</b></div>
      <div class="kv"><span>文档 ID</span><b id="docId">—</b></div>
      <div class="kv"><span>我的连接</span><b id="socketId">—</b></div>
    </section>

    <section class="card">
      <div class="card-title">房间成员 <span id="memberCount" class="count">0</span></div>
      <ul id="members" class="members"><li class="empty">等待成员加入…</li></ul>
    </section>

    <section class="card log-card">
      <div class="card-title">消息日志 <span class="muted">最新在上</span></div>
      <div id="log" class="log" aria-live="polite"></div>
    </section>
  </aside>
</main>

<div id="boot" class="boot">
  <div class="boot-box" id="bootBox">
    <div class="spinner"></div>
    <h3>正在加载协同客户端…</h3>
    <p id="bootText">加载 SpreadJS、解析协同服务端点、加入房间。</p>
  </div>
</div>

<script src="/vendor/socket.io.js"></script>
<script src="/vendor/spread-sheets.js"></script>
<script src="/client/client.js"></script>
</body>
</html>
